<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Treasure</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">✦</div>

    <div class="treasure-area" id="treasureArea">
      <img src="chest.png" alt="A cute treasure chest" id="chest">
    </div>

    <p class="message" id="message">
      This treasure only appears near 370 Jay Street.
    </p>

    <p class="coordinates" id="coordinates"></p>
    <p class="distance" id="distance"></p>

    <button id="locationButton">CHECK MY LOCATION</button>

    <p class="note">Your location stays in your browser.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
